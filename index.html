<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ST-SCOPE 音響解析フィルター v1.0.10</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 16px; background: #101418; color: #e8ecef; line-height: 1.5; }
    h1 { font-size: 19px; margin: 0 0 4px; display: flex; justify-content: space-between; align-items: center; }
    .ver { font-size: 13px; background: #2f7cf6; color: #fff; padding: 2px 8px; border-radius: 6px; }
    button { width: 100%; font-size: 18px; font-weight: bold; padding: 16px; border-radius: 12px; border: 0; background: #2f7cf6; color: #fff; cursor: pointer; margin-top: 8px; }
    button.stop { background: #da3633; }
    button:disabled { background: #37414c; color: #8b949e; }
    #status { font-size: 14px; color: #ffd97a; margin: 10px 0; min-height: 1.4em; font-weight: bold; }
    .box { background: #171c22; border: 1px solid #30363d; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .box-title { font-size: 13px; color: #9fb0c1; margin-bottom: 6px; }
    #resultArea { display: none; border-color: #22c55e; }
    audio { width: 100%; margin-top: 8px; }
    .log-item { font-size: 12px; padding: 6px 8px; border-bottom: 1px solid #262c34; display: flex; flex-direction: column; gap: 2px; }
    .log-item.speech { color: #ff8589; }
    .log-item.keep { color: #4ade80; }
    .log-debug { font-size: 11px; color: #9fb0c1; }
  </style>
</head>
<body>
  <h1><span>ST-SCOPE 音響解析フィルター</span><span class="ver">v1.0.10</span></h1>
  <button id="rec" disabled>準備中…</button>
  <div id="status">最新版を確認中…</div>

  <div id="resultArea" class="box">
    <div class="box-title" style="color:#4ade80; font-weight:bold;">✅ 完成したセッションログ（発話イベント区間を無音化済み）</div>
    <div id="resultInfo" style="font-size:13px;"></div>
    <audio id="player" controls></audio>
  </div>

  <div class="box">
    <div class="box-title">イベント検出タイムライン（新しい順）</div>
    <div id="timeline">まだ記録はありません</div>
  </div>

  <script src="https://matsuodentalassociation.github.io/ST-SCOPE/ort.min.js"></script>
  <script type="module">
    const APP_VERSION = "v1.0.10";
    const REPO = "matsuodentalassociation/ST-mock-up";
    const BRANCH = "main";

    const LABELS = {
      speechLabel: "🚫 発話イベント（無音化対象）",
      keepLabel: "✅ 連続音・環境音（保持対象）",
      emptyTimeline: "まだ記録はありません"
    };

    async function checkAndApplyLatest() {
      if (sessionStorage.getItem("st_updated_to") === APP_VERSION) return false;
      try {
        const commitRes = await fetch(`https://api.github.com/repos/${REPO}/commits/${BRANCH}?t=${Date.now()}`, { cache: "no-store" });
        if (!commitRes.ok) return false;
        const commitData = await commitRes.json();
        const sha = commitData.sha;
        const rawUrl = `https://raw.githubusercontent.com/${REPO}/${sha}/index.html?t=${Date.now()}`;
        const htmlRes = await fetch(rawUrl, { cache: "no-store" });
        if (!htmlRes.ok) return false;
        const latestHtml = await htmlRes.text();
        if (latestHtml && !latestHtml.includes(`APP_VERSION = "${APP_VERSION}"`)) {
          sessionStorage.setItem("st_updated_to", APP_VERSION);
          document.open();
          document.write(latestHtml);
          document.close();
          return true;
        }
      } catch (e) {
        console.warn("Update check skipped:", e);
      }
      return false;
    }

    const VAD_URL = "https://matsuodentalassociation.github.io/ST-SCOPE/silero_vad.onnx";
    ort.env.wasm.wasmPaths = "https://matsuodentalassociation.github.io/ST-SCOPE/";
    ort.env.wasm.numThreads = 1;

    const $ = (id) => document.getElementById(id);
    const setStatus = (t) => { $("status").textContent = t; };

    const GATE_RATIO_MIN = 0.15;
    const GATE_MAX_MIN = 0.60;
    const RISE = 0.02;
    const SILENCE_MS = 650;
    const MAX_SEG_MS = 20000;
    const PRE_MS = 500;

    let vadSession = null;
    let listen = null;
    let flushPendingSegment = null;

    async function vadInit() {
      if (vadSession) return vadSession;
      const buf = await (await fetch(VAD_URL)).arrayBuffer();
      vadSession = await ort.InferenceSession.create(buf, { executionProviders: ["wasm"] });
      return vadSession;
    }

    async function resample16k(samples, srcRate) {
      const len = Math.max(1, Math.ceil((samples.length / srcRate) * 16000));
      const off = new OfflineAudioContext(1, len, 16000);
      const buf = off.createBuffer(1, samples.length, srcRate);
      buf.getChannelData(0).set(samples);
      const src = off.createBufferSource();
      src.buffer = buf;
      src.connect(off.destination);
      src.start();
      const rendered = await off.startRendering();
      return rendered.getChannelData(0).slice();
    }

    async function vadProbs(samples16k) {
      const session = await vadInit();
      const FRAME = 512, CONTEXT = 64;
      let state = new Float32Array(2 * 1 * 128);
      let context = new Float32Array(CONTEXT);
      const probs = [];
      for (let pos = 0; pos + FRAME <= samples16k.length; pos += FRAME) {
        const frame = samples16k.subarray(pos, pos + FRAME);
        const input = new Float32Array(CONTEXT + FRAME);
        input.set(context); input.set(frame, CONTEXT);
        const feeds = {
          input: new ort.Tensor("float32", input, [1, CONTEXT + FRAME]),
          sr: new ort.Tensor("int64", BigInt64Array.from([16000n]), []),
          state: new ort.Tensor("float32", state, [2, 1, 128]),
        };
        const out = await session.run(feeds);
        probs.push(out.output.data[0]);
        state = out.stateN.data;
        context = input.slice(input.length - CONTEXT);
      }
      return probs;
    }

    async function isSpeech(samples, sr) {
      const s16 = await resample16k(samples, sr);
      const probs = await vadProbs(s16);
      let max = 0, over = 0;
      for (const p of probs) { if (p > max) max = p; if (p >= 0.5) over++; }
      const ratio = probs.length ? over / probs.length : 0;
      const speech = (ratio >= GATE_RATIO_MIN || max >= GATE_MAX_MIN);
      return {
        speech,
        debug: `音響解析数値 → max:${max.toFixed(2)} / ratio:${ratio.toFixed(2)}`
      };
    }

    function encodeWav(samples, sampleRate) {
      const bytes = new ArrayBuffer(44 + samples.length * 2);
      const v = new DataView(bytes);
      const tag = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
      tag(0, "RIFF"); v.setUint32(4, bytes.byteLength - 8, true); tag(8, "WAVE"); tag(12, "fmt ");
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
      v.setUint16(32, 2, true); v.setUint16(34, 16, true); tag(36, "data");
      v.setUint32(40, samples.length * 2, true);
      for (let i = 0; i < samples.length; i++) {
        const x = Math.max(-1, Math.min(1, samples[i]));
        v.setInt16(44 + i * 2, Math.round(x * (x < 0 ? 32768 : 32767)), true);
      }
      return new Blob([bytes], { type: "audio/wav" });
    }

    let fullChunks = [];
    let deleteRanges = [];
    let totalSamples = 0;
    let sampleRate = 48000;
    const queue = [];
    let processing = false;

    function addLog(startSec, endSec, speech, debug) {
      if ($("timeline").textContent === LABELS.emptyTimeline) $("timeline").innerHTML = "";
      const div = document.createElement("div");
      div.className = "log-item " + (speech ? "speech" : "keep");
      const label = speech ? LABELS.speechLabel : LABELS.keepLabel;
      div.innerHTML = `<div style="display:flex;justify-content:space-between;"><span>${startSec.toFixed(1)}秒 〜 ${endSec.toFixed(1)}秒</span><span>${label}</span></div><div class="log-debug">${debug}</div>`;
      $("timeline").prepend(div);
    }

    async function processQueue() {
      if (processing) return;
      processing = true;
      while (queue.length) {
        const item = queue.shift();
        const res = await isSpeech(item.samples, sampleRate);
        if (res.speech) {
          deleteRanges.push({ startSec: item.startSec, endSec: item.endSec });
        }
        addLog(item.startSec, item.endSec, res.speech, res.debug);
      }
      processing = false;
    }

    $("rec").onclick = async () => {
      if (listen) {
        stopListen();
        return;
      }
      try {
        $("resultArea").style.display = "none";
        $("timeline").textContent = LABELS.emptyTimeline;
        fullChunks = [];
        deleteRanges = [];
        totalSamples = 0;

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === "suspended") await ac.resume();
        sampleRate = ac.sampleRate;

        const src = ac.createMediaStreamSource(stream);
        const proc = ac.createScriptProcessor(4096, 1, 1);
        const mute = ac.createGain();
        mute.gain.value = 0;

        const preLen = Math.floor(sampleRate * PRE_MS / 1000);
        let pre = [], seg = null, segStartSample = 0, silentMs = 0;

        flushPendingSegment = () => {
          if (seg && seg.length > 0) {
            const parts = seg; seg = null;
            const len = parts.reduce((n, c) => n + c.length, 0);
            const all = new Float32Array(len);
            let o = 0; for (const c of parts) { all.set(c, o); o += c.length; }
            const startSec = segStartSample / sampleRate;
            const endSec = totalSamples / sampleRate;
            queue.push({ samples: all, startSec, endSec });
            processQueue();
          }
        };

        proc.onaudioprocess = (e) => {
          const ch = e.inputBuffer.getChannelData(0).slice();
          fullChunks.push(ch);

          let peak = 0;
          for (let i = 0; i < ch.length; i++) { const a = Math.abs(ch[i]); if (a > peak) peak = a; }
          const chunkMs = (ch.length / sampleRate) * 1000;

          if (!seg) {
            pre.push(ch);
            let total = pre.reduce((n, c) => n + c.length, 0);
            while (pre.length > 1 && total - pre[0].length >= preLen) { total -= pre[0].length; pre.shift(); }
            if (peak >= RISE) {
              seg = pre;
              pre = [];
              silentMs = 0;
              segStartSample = Math.max(0, totalSamples - total);
            }
          } else {
            seg.push(ch);
            if (peak >= RISE) silentMs = 0; else silentMs += chunkMs;
            const segMs = (seg.reduce((n, c) => n + c.length, 0) / sampleRate) * 1000;
            if ((silentMs >= SILENCE_MS && segMs >= 800) || segMs >= MAX_SEG_MS) {
              const parts = seg; seg = null;
              const len = parts.reduce((n, c) => n + c.length, 0);
              const all = new Float32Array(len);
              let o = 0; for (const c of parts) { all.set(c, o); o += c.length; }

              const startSec = segStartSample / sampleRate;
              const endSec = (totalSamples + ch.length) / sampleRate;
              queue.push({ samples: all, startSec, endSec });
              processQueue();
            }
          }
          totalSamples += ch.length;
        };

        src.connect(proc);
        proc.connect(mute);
        mute.connect(ac.destination);
        listen = { stream, ac, proc };
        $("rec").textContent = "録音停止 ＆ ログ作成";
        $("rec").classList.add("stop");
        setStatus("録音中… 発話や連続音を出してテストしてね");
      } catch (e) {
        setStatus("マイクエラー: " + (e && e.message || e));
      }
    };

    async function stopListen() {
      if (!listen) return;
      listen.proc.disconnect();
      listen.ac.close();
      listen.stream.getTracks().forEach((t) => t.stop());
      listen = null;

      if (flushPendingSegment) {
        flushPendingSegment();
        flushPendingSegment = null;
      }

      $("rec").textContent = "録音開始";
      $("rec").classList.remove("stop");
      setStatus("残りの解析を待って、発話イベント区間を無音化しています…");

      while (processing || queue.length > 0) {
        await new Promise((r) => setTimeout(r, 200));
      }

      const all = new Float32Array(totalSamples);
      let offset = 0;
      for (const c of fullChunks) { all.set(c, offset); offset += c.length; }

      for (const r of deleteRanges) {
        const s = Math.max(0, Math.floor(r.startSec * sampleRate));
        const e = Math.min(all.length, Math.ceil(r.endSec * sampleRate));
        all.fill(0, s, e);
      }

      const wavBlob = encodeWav(all, sampleRate);
      $("player").src = URL.createObjectURL(wavBlob);
      $("resultInfo").textContent = `全体 ${(totalSamples / sampleRate).toFixed(1)}秒のうち、発話イベントと判定された ${deleteRanges.length}区間 を無音にしました。`;
      $("resultArea").style.display = "block";
      setStatus("完了！下のプレイヤーで「発話だけが消えているか」聴いてみてね");
    }

    (async () => {
      try {
        const updated = await checkAndApplyLatest();
        if (updated) return;
        setStatus("音響解析モデルを読み込み中…");
        await vadInit();
        $("rec").disabled = false;
        $("rec").textContent = "録音開始";
        setStatus("準備完了！「録音開始」を押してテストしてね");
      } catch (e) {
        setStatus("準備エラー: " + (e && e.message || e));
      }
    })();
  </script>
</body>
</html>
