<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音声区間判定アプリ</title>
<style>
  body { font-family: sans-serif; margin: 16px; background: #101418; color: #e8ecef; }
  h1 { font-size: 20px; }
  button { font-size: 17px; padding: 12px 18px; border-radius: 10px; border: 0; background: #2f7cf6; color: #fff; }
  button.stop { background: #c33; }
  button.sub { background: #37414c; font-size: 14px; padding: 9px 12px; }
  select { font-size: 15px; padding: 6px; border-radius: 6px; }
  .row { margin: 12px 0; }
  #status { font-size: 15px; color: #ffd97a; min-height: 1.4em; }
  .seg { border: 1px solid #333; border-left: 6px solid #888; border-radius: 8px; padding: 10px 12px; margin: 10px 0; background: #171c22; }
  .seg.voice { border-left-color: #e5484d; }
  .seg.none { border-left-color: #3a4653; }
  .seg .head { display: flex; justify-content: space-between; align-items: baseline; }
  .seg .verdict { font-size: 18px; font-weight: bold; }
  .seg.voice .verdict { color: #ff8589; }
  .seg.none .verdict { color: #9fb0c1; }
  .seg .meta { font-size: 13px; color: #9fb0c1; margin-top: 4px; }
  .seg button { font-size: 13px; padding: 6px 12px; margin-top: 8px; }
  label { font-size: 14px; color: #9fb0c1; }
  #drop { border: 2px dashed #3a4653; border-radius: 10px; padding: 14px; text-align: center; color: #9fb0c1; font-size: 14px; }
</style>
</head>
<body>
<h1>音声区間判定アプリ</h1>

<div class="row">
  <button id="rec">聞き取り開始</button>
</div>
<div class="row">
  <label>認識モデル
    <select id="model">
      <option value="Xenova/whisper-tiny" selected>tiny（軽い・速い）</option>
      <option value="Xenova/whisper-base">base（重い・少し正確）</option>
    </select>
  </label>
  <label>言語
    <select id="lang">
      <option value="japanese" selected>日本語</option>
      <option value="english">英語</option>
    </select>
  </label>
</div>
<div class="row" id="status">準備中…</div>

<div class="row" id="drop">音声ファイルをここに落とすか、
  <button class="sub" id="pick">ファイルを選ぶ</button>
  <input type="file" id="file" accept="audio/*" hidden>
</div>

<h2 style="font-size:16px">区間（新しい順）</h2>
<div id="list"></div>

<script src="https://matsuodentalassociation.github.io/ST-SCOPE/ort.min.js"></script>
<script type="module">
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";
env.allowLocalModels = false;

const VAD_URL = "https://matsuodentalassociation.github.io/ST-SCOPE/silero_vad.onnx";
ort.env.wasm.wasmPaths = "https://matsuodentalassociation.github.io/ST-SCOPE/";
ort.env.wasm.numThreads = 1;

const $ = (id) => document.getElementById(id);
const status = (t) => { $("status").textContent = t; };

// ===== 判定の物差し =====
const VAD_THR = 0.5;          // 声らしさのしきい値
const GATE_RATIO_MIN = 0.02;  // 声らしいフレームの割合がこれ以上
const GATE_MAX_MIN = 0.50;    // 声らしさ最大がこれ以上（どちらかで門番通過）
const FLAT_MAX = 0.55;        // 音の「平らさ」がこれ以上なら定常音（ファン等）として門番で落とす
const ASR_MAX_SEC = 10;       // 認識にかけるのは区間の先頭ここまで
const REP_UNIQUE_MAX = 0.15;  // 単語の種類÷総数がこれ以下なら繰り返し幻覚として破棄
const REP_WORDS_MIN = 8;      // 繰り返し判定は単語数がこれ以上の時だけ

// ===== 音声の読み込み（16kHz モノラル Float32 にそろえる）=====
async function decode16k(blob) {
  const buf = await blob.arrayBuffer();
  const tmp = new OfflineAudioContext(1, 1, 16000);
  const audio = await tmp.decodeAudioData(buf);
  const len = Math.ceil(audio.duration * 16000);
  const off = new OfflineAudioContext(1, len, 16000);
  const src = off.createBufferSource();
  src.buffer = audio;
  src.connect(off.destination);
  src.start();
  const rendered = await off.startRendering();
  return rendered.getChannelData(0).slice();
}

// ===== 門番1：Silero VAD（声らしさ）=====
let vadSession = null;
async function vadInit() {
  if (vadSession) return vadSession;
  const modelBuf = await (await fetch(VAD_URL)).arrayBuffer();
  vadSession = await ort.InferenceSession.create(modelBuf, { executionProviders: ["wasm"] });
  return vadSession;
}
async function vadProbs(samples) {
  const session = await vadInit();
  const FRAME = 512, CONTEXT = 64;
  let state = new Float32Array(2 * 1 * 128);
  let context = new Float32Array(CONTEXT);
  const probs = [];
  for (let pos = 0; pos + FRAME <= samples.length; pos += FRAME) {
    const frame = samples.subarray(pos, pos + FRAME);
    const input = new Float32Array(CONTEXT + FRAME);
    input.set(context); input.set(frame, CONTEXT);
    const feeds = {
      input: new ort.Tensor("float32", input, [1, CONTEXT + FRAME]),
      sr: new ort.Tensor("int64", BigInt64Array.from([16000n]), []),
      state: new ort.Tensor("float32", state, [2, 1, 128]),
    };
    const out = await session.run(feeds);
    probs.push(out.output.data[0]);
    state = out.stateN.data;
    context = input.slice(input.length - CONTEXT);
  }
  return probs;
}

// ===== 門番2：定常音（ファン等）の検出。声は音の色が揺れる、定常音は平ら =====
function spectralFlatness(samples) {
  const N = 512;
  const vals = [];
  for (let pos = 0; pos + N <= samples.length; pos += N) {
    const frame = samples.subarray(pos, pos + N);
    let rms = 0;
    for (let i = 0; i < N; i++) rms += frame[i] * frame[i];
    rms = Math.sqrt(rms / N);
    if (rms < 0.01) continue; // 静かなフレームは数えない
    // 簡易FFT（2の累乗・反復型）
    const re = new Float32Array(N), im = new Float32Array(N);
    for (let i = 0; i < N; i++) re[i] = frame[i];
    for (let i = 1, j = 0; i < N; i++) {
      let bit = N >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) { const t = re[i]; re[i] = re[j]; re[j] = t; }
    }
    for (let len = 2; len <= N; len <<= 1) {
      const ang = -2 * Math.PI / len;
      for (let i = 0; i < N; i += len) {
        for (let k = 0; k < len / 2; k++) {
          const wr = Math.cos(ang * k), wi = Math.sin(ang * k);
          const xr = re[i + k + len / 2], xi = im[i + k + len / 2];
          const vr = xr * wr - xi * wi, vi = xr * wi + xi * wr;
          re[i + k + len / 2] = re[i + k] - vr; im[i + k + len / 2] = im[i + k] - vi;
          re[i + k] += vr; im[i + k] += vi;
        }
      }
    }
    let sumLog = 0, sum = 0, cnt = 0;
    for (let i = 1; i < N / 2; i++) {
      const mag = Math.sqrt(re[i] * re[i] + im[i] * im[i]) + 1e-12;
      sumLog += Math.log(mag); sum += mag; cnt++;
    }
    vals.push(Math.exp(sumLog / cnt) / (sum / cnt));
  }
  if (!vals.length) return 0;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

// ===== 音声認識（端末内・文字は残さない）=====
let asrPipe = null, asrModel = null;
async function asrInit(model) {
  if (asrPipe && asrModel === model) return asrPipe;
  asrPipe = null;
  status("認識モデルを読み込み中…（初回は時間がかかります）");
  asrPipe = await pipeline("automatic-speech-recognition", model);
  asrModel = model;
  return asrPipe;
}
async function countWords(text, lang) {
  try {
    const seg = new Intl.Segmenter(lang === "english" ? "en" : "ja", { granularity: "word" });
    return [...seg.segment(text)].filter((s) => s.isWordLike).length;
  } catch (e) {
    return text.replace(/\s+/g, "").length > 0 ? 1 : 0;
  }
}
async function wordList(text, lang) {
  try {
    const seg = new Intl.Segmenter(lang === "english" ? "en" : "ja", { granularity: "word" });
    return [...seg.segment(text)].filter((s) => s.isWordLike).map((s) => s.segment);
  } catch (e) {
    return text.split(/\s+/).filter(Boolean);
  }
}

// ===== 判定の本体：区間の音 →「音声」か否か。文字は返さない =====
async function judge(samples) {
  // 門番1：声らしさ
  const probs = await vadProbs(samples);
  let max = 0, over = 0;
  for (const p of probs) { if (p > max) max = p; if (p >= VAD_THR) over++; }
  const ratio = probs.length ? over / probs.length : 0;
  const gatePass = ratio >= GATE_RATIO_MIN || max >= GATE_MAX_MIN;
  if (!gatePass) return { voice: false, reason: "門番で除外（声らしくない）", ratio, max, words: 0 };
  // 門番2：定常音
  const flat = spectralFlatness(samples);
  if (flat >= FLAT_MAX) return { voice: false, reason: "門番で除外（変化のない定常音）", ratio, max, words: 0, flat };
  // 認識（先頭 ASR_MAX_SEC 秒まで）
  const pipe = await asrInit($("model").value);
  const input = samples.slice(0, 16000 * ASR_MAX_SEC);
  const out = await pipe(input, { language: $("lang").value, task: "transcribe" });
  const words = await wordList(out.text || "", $("lang").value);
  if (!words.length) return { voice: false, reason: "言葉にならなかった", ratio, max, words: 0, flat };
  // 繰り返し幻覚の破棄
  if (words.length >= REP_WORDS_MIN) {
    const uniq = new Set(words).size;
    if (uniq / words.length <= REP_UNIQUE_MAX) {
      return { voice: false, reason: "破棄（同じ言葉の繰り返し）", ratio, max, words: words.length, flat };
    }
  }
  return { voice: true, reason: "言葉として認識できた", ratio, max, words: words.length, flat };
}

// ===== 区間の表示（タイムスタンプだけを残す。文字は出さない）=====
function fmtTime(d) {
  const p = (n) => String(n).padStart(2, "0");
  return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
function addSegment(startDate, endDate, blob, label) {
  const el = document.createElement("div");
  el.className = "seg";
  el.innerHTML = '<div class="head"><span class="verdict">判定中…</span></div>' +
    '<div class="meta"></div>';
  const meta = el.querySelector(".meta");
  const dur = ((endDate - startDate) / 1000).toFixed(1);
  meta.textContent = fmtTime(startDate) + " 〜 " + fmtTime(endDate) + "（" + dur + "秒）" + (label ? "｜" + label : "");
  const play = document.createElement("button");
  play.className = "sub"; play.textContent = "この区間を聴く";
  const url = URL.createObjectURL(blob);
  play.onclick = () => { new Audio(url).play(); };
  el.appendChild(play);
  const list = $("list");
  list.prepend(el);
  decode16k(blob).then((samples) => judge(samples)).then((r) => {
    el.classList.add(r.voice ? "voice" : "none");
    el.querySelector(".verdict").textContent = r.voice ? "音声" : "音声ではない";
    meta.textContent += "｜" + r.reason + "｜単語数:" + r.words +
      "｜声らしさ最大:" + r.max.toFixed(2) + "（割合" + (r.ratio * 100).toFixed(1) + "%）";
    status("判定が終わった。聞き取りは続けられる");
  }).catch((e) => {
    el.querySelector(".verdict").textContent = "判定できなかった";
    meta.textContent += "｜" + (e && e.message || e);
  });
}

// ===== ファイル入力 =====
$("pick").onclick = () => $("file").click();
$("file").onchange = () => {
  const f = $("file").files[0];
  if (f) { const now = new Date(); addSegment(now, now, f, f.name); }
};
$("drop").ondragover = (e) => e.preventDefault();
$("drop").ondrop = (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) { const now = new Date(); addSegment(now, now, f, f.name); }
};

// ===== 聞き取り：音圧が立ち上がったら捕まえ、静かになったら区切って判定 =====
const RISE = 0.02;         // 立ち上がりとみなす音の大きさ（ピーク 0〜1）
const SILENCE_MS = 650;    // この長さ静かになったら区切る
const MAX_SEG_MS = 20000;  // 1区間の上限
const PRE_MS = 500;        // 立ち上がりの少し前から捕まえる
let listen = null;

function encodeWav(samples, sampleRate) {
  const bytes = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(bytes);
  const tag = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  tag(0, "RIFF"); v.setUint32(4, bytes.byteLength - 8, true); tag(8, "WAVE"); tag(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); tag(36, "data");
  v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const x = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44 + i * 2, Math.round(x * (x < 0 ? 32768 : 32767)), true);
  }
  return new Blob([bytes], { type: "audio/wav" });
}

$("rec").onclick = async () => {
  if (listen) { stopListen(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(stream);
    const proc = ac.createScriptProcessor(4096, 1, 1);
    const sr = ac.sampleRate;
    const preLen = Math.floor(sr * PRE_MS / 1000);
    let pre = [], seg = null, segStart = null, silentMs = 0;
    proc.onaudioprocess = (e) => {
      const ch = e.inputBuffer.getChannelData(0);
      let peak = 0;
      for (let i = 0; i < ch.length; i++) { const a = Math.abs(ch[i]); if (a > peak) peak = a; }
      const chunkMs = ch.length / sr * 1000;
      if (!seg) {
        pre.push(ch.slice());
        let total = pre.reduce((n, c) => n + c.length, 0);
        while (pre.length > 1 && total - pre[0].length >= preLen) { total -= pre[0].length; pre.shift(); }
        if (peak >= RISE) {
          seg = pre; pre = []; silentMs = 0;
          segStart = new Date(Date.now() - PRE_MS);
          status("音を捕まえた。聞き取り中…");
        } else {
          status("聞き取り中… 音の立ち上がりを待っている");
        }
      } else {
        seg.push(ch.slice());
        if (peak >= RISE) silentMs = 0; else silentMs += chunkMs;
        const segMs = seg.reduce((n, c) => n + c.length, 0) / sr * 1000;
        if ((silentMs >= SILENCE_MS && segMs >= 800) || segMs >= MAX_SEG_MS) {
          const parts = seg; seg = null;
          const endDate = new Date();
          const total = parts.reduce((n, c) => n + c.length, 0);
          const all = new Float32Array(total);
          let o = 0; for (const c of parts) { all.set(c, o); o += c.length; }
          addSegment(segStart, endDate, encodeWav(all, sr), "聞き取り");
          status("区間を判定中… 聞き取りは続いている");
        }
      }
    };
    src.connect(proc); proc.connect(ac.destination);
    listen = { stream, ac, proc };
    $("rec").textContent = "聞き取り停止";
    $("rec").classList.add("stop");
    status("聞き取り中… 音の立ち上がりを待っている");
  } catch (e) {
    status("マイクが使えません: " + (e && e.message || e));
  }
};
function stopListen() {
  if (!listen) return;
  listen.proc.disconnect(); listen.ac.close();
  listen.stream.getTracks().forEach((t) => t.stop());
  listen = null;
  $("rec").textContent = "聞き取り開始";
  $("rec").classList.remove("stop");
  status("停止した");
}

// ===== 準備 =====
(async () => {
  try {
    await vadInit();
    status("準備完了。聞き取り開始を押して");
  } catch (e) {
    status("準備に失敗: " + (e && e.message || e));
  }
})();
</script>
</body>
</html>
