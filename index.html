<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>録音＋音声認識 同時動作テスト</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 16px;
      line-height: 1.5;
    }
    h1 { font-size: 18px; margin-bottom: 12px; }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      margin-bottom: 12px;
      cursor: pointer;
    }
    #btnStart { background: #2563eb; color: #fff; }
    #btnStop { background: #dc2626; color: #fff; display: none; }
    .box {
      background: #222;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .label { font-size: 12px; color: #aaa; }
    .val { font-size: 16px; font-weight: bold; margin-top: 4px; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    #meterBar {
      width: 0%;
      height: 12px;
      background: #4ade80;
      border-radius: 4px;
      transition: width 0.05s;
      margin-top: 6px;
    }
    #log {
      background: #000;
      padding: 10px;
      border-radius: 8px;
      height: 240px;
      overflow-y: auto;
      font-size: 13px;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>録音＋音声認識 同時動作テスト</h1>

  <button id="btnStart">テスト開始</button>
  <button id="btnStop">テスト停止</button>

  <div class="box">
    <div class="label">① 録音エンジン（マイク音量）</div>
    <div id="micStatus" class="val">待機中</div>
    <div id="meterBar"></div>
  </div>

  <div class="box">
    <div class="label">② OS音声認識（Web Speech API）</div>
    <div id="speechStatus" class="val">待機中</div>
  </div>

  <div class="label">動作ログ（タイムスタンプ付き）</div>
  <div id="log"></div>

  <script>
    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const micStatus = document.getElementById('micStatus');
    const speechStatus = document.getElementById('speechStatus');
    const meterBar = document.getElementById('meterBar');
    const logEl = document.getElementById('log');

    let audioCtx = null;
    let micStream = null;
    let animId = null;
    let recognition = null;
    let isRunning = false;

    function addLog(msg) {
      const now = new Date();
      const ts = now.toTimeString().split(' ')[0];
      logEl.textContent = `[${ts}] ${msg}\n` + logEl.textContent;
    }

    btnStart.onclick = async () => {
      isRunning = true;
      btnStart.style.display = 'none';
      btnStop.style.display = 'block';
      logEl.textContent = '';
      addLog('テストを開始します...');

      // 1. 録音エンジン（マイク入力）の起動
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(micStream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        micStatus.textContent = '動作中（音量取得OK）';
        micStatus.className = 'val ok';
        addLog('録音エンジン起動成功');

        function updateMeter() {
          if (!isRunning) return;
          analyser.getByteTimeDomainData(dataArray);
          let max = 0;
          for (let i = 0; i < dataArray.length; i++) {
            const v = Math.abs(dataArray[i] - 128) / 128;
            if (v > max) max = v;
          }
          meterBar.style.width = Math.min(100, Math.round(max * 200)) + '%';
          animId = requestAnimationFrame(updateMeter);
        }
        updateMeter();
      } catch (e) {
        micStatus.textContent = 'エラー: ' + e.message;
        micStatus.className = 'val err';
        addLog('録音エンジンエラー: ' + e.message);
      }

      // 2. OS音声認識の起動
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        speechStatus.textContent = 'このブラウザは音声認識に非対応です';
        speechStatus.className = 'val err';
        addLog('音声認識API非対応');
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        speechStatus.textContent = '動作中（認識待機）';
        speechStatus.className = 'val ok';
        addLog('音声認識スタート');
      };

      recognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const text = event.results[i][0].transcript;
          const isFinal = event.results[i].isFinal;
          if (isFinal) {
            addLog(`【確定】"${text}"`);
          } else {
            speechStatus.textContent = `認識中: ${text}`;
          }
        }
      };

      recognition.onerror = (event) => {
        speechStatus.textContent = 'エラー: ' + event.error;
        speechStatus.className = 'val err';
        addLog('音声認識エラー: ' + event.error);
      };

      recognition.onend = () => {
        addLog('音声認識が終了しました');
        if (isRunning) {
          addLog('自動再起動を試みます...');
          try {
            recognition.start();
          } catch (e) {
            addLog('再起動失敗: ' + e.message);
          }
        } else {
          speechStatus.textContent = '停止';
          speechStatus.className = 'val';
        }
      };

      try {
        recognition.start();
      } catch (e) {
        addLog('音声認識開始エラー: ' + e.message);
      }
    };

    btnStop.onclick = () => {
      isRunning = false;
      btnStart.style.display = 'block';
      btnStop.style.display = 'none';

      if (animId) cancelAnimationFrame(animId);
      if (micStream) micStream.getTracks().forEach(t => t.stop());
      if (audioCtx) audioCtx.close();
      if (recognition) recognition.stop();

      micStatus.textContent = '停止';
      micStatus.className = 'val';
      meterBar.style.width = '0%';
      addLog('テストを停止しました');
    };
  </script>
</body>
</html>
